name: Test
# Runs dev/test.sh on every push (a pull request's pushes included): the Python and smoke tests, and the React page's typecheck, Vitest
# suite and check:cdn (the built page in Chrome, with its size and first-visit budgets).
on: push
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      # dev/build.py tests main's page from where the branch started (git merge-base HEAD main)
      - name: Have a local main
        run: git rev-parse --verify -q main || git branch main origin/main
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 25
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install the React page's packages
        if: hashFiles('web/package-lock.json') != ''
        run: npm ci --prefix web
      - name: Run every test
        env:
          CHROME: /usr/bin/google-chrome
        run: sh dev/test.sh
