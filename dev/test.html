<!doctype html>
<!-- Smoke test: drives dev/preview.html (the real page on the mock runtime) and checks the core flows and the
     security fixes from 0.9.1. Run dev/test.sh, or serve dev/ and open test.html. Results go in #out and the title. -->
<meta charset="utf-8"><title>running</title>
<pre id="out"></pre><iframe id="f" style="width:1200px;height:800px"></iframe>
<script>
const out=[],f=document.getElementById("f"),sleep=ms=>new Promise(r=>setTimeout(r,ms));let failed=0;
// wait for something async (like reading a file) that headless Chrome's fast-forwarded clock doesn't wait for
const until=async(fn,tries=400)=>{for(let i=0;i<tries&&!fn();i++)await sleep(25);return fn()};
const need=(el,sel)=>{if(!el)throw new Error("missing "+sel);return el};
const check=(name,ok,detail="")=>{if(!ok)failed++;out.push(`${ok?"PASS":"FAIL"} ${name}${ok||!detail?"":" — "+detail}`)};
f.src="preview.html";
f.onload=async()=>{
  const w=f.contentWindow,d=f.contentDocument,q=s=>d.querySelector(s),errs=[];
  w.addEventListener("error",e=>errs.push(e.message));
  w.addEventListener("unhandledrejection",e=>errs.push("unhandled: "+(e.reason?.message||e.reason)));
  await sleep(900);
  const titles=()=>[...d.querySelectorAll("#rack .cap .t")].map(x=>x.textContent);
  const openRecord=async t=>{[...d.querySelectorAll(".sleeve-btn")].find(b=>b.textContent.includes(t)).click();await sleep(300)};
  const site=()=>w.__data.settings.site,emit=()=>{w.__emit("settings");return sleep(200)};  // the mock replaces the doc on each write
  try{
    // filter
    const all=titles().length;
    q('.fchip[data-f="p1"]').click();await sleep(150);
    check("filter: top want only",titles().join()==="Abbey Road",titles().join());
    q('.fchip[data-f="p1"]').click();await sleep(150);
    check("filter: cleared shows all",titles().length===all);
    // search
    q("#searchBtn").click();q("#q").value="miles blue";q("#q").dispatchEvent(new Event("input"));await sleep(150);
    check("search: every word matches",titles().join()==="Kind of Blue",titles().join());
    q("#q").dispatchEvent(new KeyboardEvent("keydown",{key:"Escape",bubbles:true}));await sleep(150);
    check("search: Escape clears",q("#searchBar").hidden&&titles().length===all);
    // listening: read from the play notes, the same numbers on the record and in Equipment
    await openRecord("Kind of Blue");
    const line=q("#logFs .hint")?.textContent||"";
    check("listening: record line",line.startsWith("Played 3 times · 1.9 h · last "),line);
    check("badges: top this month",[...d.querySelectorAll(".pills .badge")].map(x=>x.textContent).join()==="Top this month");
    q("#closeBtn").click();await sleep(200);
    await openRecord("Blue Train");
    const old=q("#logFs .hint")?.textContent||"";
    check("badges: none without earning one",!d.querySelector(".pills .badge"));
    check("listening: last year's play shows its year",/^Played once · 0\.7 h · last .+, \d{4}$/.test(old),old);
    q("#closeBtn").click();await sleep(200);
    await openRecord("Aja");
    check("listening: no line on an ordered record",!/^Played /.test(q("#logFs .hint")?.textContent||""));
    q("#closeBtn").click();await sleep(200);
    q("#stylusBtn").click();await sleep(300);
    const sum=q(".secs fieldset .hint")?.textContent||"",top=[...d.querySelectorAll(".mostplayed .tn b")].map(x=>x.textContent);
    check("listening: summary",/ · 21 in all · last spun Kind of Blue, /.test(sum),sum);
    check("listening: most played first, ties by hours",top.join()==="Rumours,Kind of Blue,Blue Train",top.join());
    w.__data.records.r3.notes=[...w.__data.records.r3.notes,{d:"2020-01-01",t:"Played one side (~21 min)"}];w.__emit("records");await sleep(300);
    check("listening: Equipment follows record changes",/ · 22 in all /.test(q(".secs fieldset .hint")?.textContent||""),q(".secs fieldset .hint")?.textContent);
    q(".mostplayed button").click();await sleep(300);
    check("listening: row opens the record",q("#sTitle")?.textContent==="Rumours",q("#sTitle")?.textContent);
    const badges=()=>[...d.querySelectorAll(".pills .badge")].map(x=>x.textContent).join();
    check("badges: most played ever and hours",badges()==="Most played ever,10+ hours",badges());
    const R=w.__data.records,kob=R.r1.notes.slice(),play={d:"2020-01-01",t:"Played the whole album (~46 min)"};
    R.r1.notes=[...kob,...Array(14).fill(play)];w.__emit("records");await sleep(300);
    q("#closeBtn").click();await sleep(200);await openRecord("Rumours");
    check("badges: a tie for most played earns nothing",badges()==="10+ hours",badges());
    R.r1.notes=kob;R.r2.status="wish";w.__emit("records");await sleep(300);q("#closeBtn").click();await sleep(200);
    await openRecord("Kind of Blue");
    check("badges: only owned records compete",badges().startsWith("Most played ever"),badges());
    R.r2.status="own";w.__emit("records");await sleep(300);
    q("#closeBtn").click();await sleep(200);
    // listening log: compact play rows, the latest 5 with Show all, delete only in edit mode
    await openRecord("Kind of Blue");
    const first=q("#logFs .log li p");
    check("log: play reads compactly, comment below",first?.querySelector(".pl")?.textContent==="Whole album · Living room · 46 min"&&first.textContent.endsWith("Side B hit different tonight."),first?.textContent);
    check("log: no delete in view mode",!d.querySelector("#logFs .x"));
    q("#modeBtn").click();await sleep(300);
    const dels=[...d.querySelectorAll(".editpart .log .x")];
    check("log: edit mode lists every entry",dels.length===w.__data.records.r1.notes.length,`${dels.length}`);
    const sh=q("#sheet");sh.scrollTop=sh.scrollHeight;const y0=sh.scrollTop;
    dels.find(x=>x.closest("li").textContent.includes("Cleaned it")).click();await sleep(400);
    check("log: delete keeps the scroll position",y0>0&&q("#sheet").scrollTop>0,`${y0} → ${q("#sheet").scrollTop}`);
    check("log: delete removes that entry",!w.__data.records.r1.notes.some(n=>n.t.startsWith("Cleaned it"))&&w.__data.records.r1.notes.length===4);
    q("#modeBtn").click();await sleep(300);
    check("log: play count unchanged",(q("#logFs .hint")?.textContent||"").startsWith("Played 3 times"),q("#logFs .hint")?.textContent);
    q("#closeBtn").click();await sleep(200);
    await openRecord("Rumours");
    const rows=()=>d.querySelectorAll("#logFs .log li").length;
    check("log: latest 5 with Show all",rows()===5&&q("#logMore")?.textContent==="Show all 17",`${rows()} ${q("#logMore")?.textContent}`);
    q("#logMore").click();await sleep(300);
    check("log: Show all shows the rest",rows()===17&&q("#logMore").textContent==="Show fewer");
    q("#closeBtn").click();await sleep(200);await openRecord("Rumours");
    check("log: short again after closing",rows()===5);
    q("#f-note").value="half typed";q("#logMore").click();await sleep(200);
    check("log: Show all keeps a half-typed note",q("#f-note").value==="half typed"&&rows()===17);
    q("#f-note").value="";q("#closeBtn").click();await sleep(200);
    const BT=w.__data.records.r3,bt=BT.notes.slice();
    BT.notes=[...bt,null,{d:"March 3, 2024",t:"Bought a second copy."},{d:"2026-01-02",t:"Played the whole album twice at Dave's (~40 min)"}];
    w.__emit("records");await sleep(300);await openRecord("Blue Train");
    const texts=[...d.querySelectorAll("#logFs .log li")].map(x=>x.textContent);
    check("log: hand-typed play shows as written",texts[0].includes("Played the whole album twice at Dave's (~40 min)"),texts[0]);
    check("log: odd date shows as written, blank entry skipped",texts[1].startsWith("March 3, 2024Bought")&&texts.length===BT.notes.filter(Boolean).length,texts.join(" | "));
    q("#closeBtn").click();await sleep(200);BT.notes=bt;w.__emit("records");await sleep(300);
    q("#closeBtn").click();await sleep(200);
    // research: pin one entry, save one as a note, keep the pin through new research
    await openRecord("Abbey Road");
    const resOrder=()=>[...d.querySelectorAll(".resentry")].map(x=>x.dataset.res).join();
    q('[data-respin="ab1"]').click();await sleep(300);
    const ab=()=>w.__data.records.r4;
    check("research: pinned entry goes first, open",resOrder()==="ab1,ab2"&&q('.resentry[data-res="ab1"]').open&&ab().researchLog.find(e=>e.id==="ab1").pinned,resOrder());
    q('[data-respin="ab2"]').click();await sleep(300);
    check("research: one pin at a time",ab().researchLog.filter(e=>e.pinned).map(e=>e.id).join()==="ab2");
    q('[data-respin="ab2"]').click();await sleep(300);q('[data-respin="ab1"]').click();await sleep(300);
    q("#closeBtn").click();await sleep(200);await openRecord("Abbey Road");
    check("research: pin survives reopening",resOrder()==="ab1,ab2",resOrder());
    q('[data-resnote="ab2"]').click();await sleep(300);q('[data-resnote="ab2"]').click();await sleep(300);
    const saved=ab().notes.filter(n=>n.t==="Research: Hunt the 2019 half-speed reissue under $40. About $30-40 for 2019; firsts $150+.").length;
    check("research: save as note adds one note",saved===1&&q('[data-resnote="ab2"]').disabled,`${saved} notes`);
    ab().researchLog=[...Array.from({length:9},(_,i)=>({id:"x"+i,at:"2026-01-0"+(i+1),headline:"Entry "+i})),ab().researchLog.find(e=>e.id==="ab1")];
    w.__emit("records");await sleep(300);q("#resBtn").click();await sleep(600);
    const ids=ab().researchLog.map(e=>e.id);
    check("research: a new run keeps the pinned entry",ids.length===10&&ids.includes("ab1")&&!ids.includes("x8"),ids.join());
    q('[data-respin="ab1"]').click();await sleep(300);
    check("research: unpinned entry closes again",!q('.resentry[data-res="ab1"]').open);
    const P=(id,pinned)=>({id,at:"2026-01-01",headline:"Entry "+id,...(pinned?{pinned:true}:{})});
    ab().researchLog=[P("p1",1),P("p2",1),...Array.from({length:9},(_,i)=>P("y"+i))];w.__emit("records");await sleep(300);
    q("#resBtn").click();await sleep(600);
    const ids2=ab().researchLog.map(e=>e.id);
    check("research: two pins still cap the list at 10",ids2.length===10&&ids2.includes("p1")&&ids2.includes("p2"),ids2.join());
    ab().researchLog=[{id:"np",at:"2026-01-01",headline:"Hunt the reissue",price:"About $30."},{id:"em",at:"2026-01-01"}];w.__emit("records");await sleep(300);
    check("research: nothing to save, no Save as note",!q('[data-resnote="em"]'));
    q('[data-resnote="np"]').click();await sleep(300);
    check("research: note gets its period",ab().notes.some(n=>n.t==="Research: Hunt the reissue. About $30."),ab().notes.map(n=>n.t).join(" | "));
    q("#closeBtn").click();await sleep(200);
    // add equipment
    q("#stylusBtn").click();await sleep(300);const cards=d.querySelectorAll(".gcard").length;
    q('[data-addgear="den"]').click();await sleep(200);q('input[name="agType"][value="cartridge"]').click();await sleep(200);
    q("#ag-cancel").click();await sleep(300);
    check("add equipment: cancel saves nothing",d.querySelectorAll(".gcard").length===cards);
    q('[data-addgear="den"]').click();await sleep(200);q('input[name="agType"][value="stylus"]').click();await sleep(200);
    q("#ag-name").value="Test stylus";q("#ag-start").value="12";q('#ag-form button[type=submit]').click();await sleep(500);
    const g=Object.values(w.__data.gear).find(x=>x.name==="Test stylus");
    check("add equipment: saved with its fields",g&&g.setup==="den"&&g.tracks&&g.startHours===12&&g.ratedHigh===500,JSON.stringify(g));
    q("#closeBtn").click();await sleep(200);
    // tracking link stays one escaped attribute
    await openRecord("Aja");q("#modeBtn").click();await sleep(300);
    q("#f-track").value='https://example.com/" data-injected="yes';q("#f-track").dispatchEvent(new Event("input",{bubbles:true}));await sleep(1200);
    q("#closeBtn").click();await sleep(300);await openRecord("Aja");
    const a=[...d.querySelectorAll("a")].find(x=>x.textContent.includes("Track package"));
    check("tracking link: no injected attribute",a&&!a.hasAttribute("data-injected"),a?[...a.attributes].map(x=>x.name).join():"no link");
    q("#closeBtn").click();await sleep(200);
    // starting the task never passes record text along
    await openRecord("Kind of Blue");q("#modeBtn").click();await sleep(300);q("#enrichBtn").click();await sleep(400);
    const call=w.__calls.filter(c=>c[1]==="fire_trigger").pop(),text=call?call[2].text:"";
    check("task start: counts, no titles",call&&!/Kind of Blue|Rumours|Aja/.test(text),text);
    q("#closeBtn").click();await sleep(200);
    // update check takes plain versions only
    site().update={latest:"9.9.9/../../../someone/else/main",checkedMs:Date.now()};await emit();
    check("update: odd version ignored",!q("#settingsBtn").classList.contains("hasupdate"));
    site().update={latest:"9.9.9",checkedMs:Date.now()};await emit();
    check("update: plain version offered",q("#settingsBtn").classList.contains("hasupdate"));
    // background asset ids never reach CSS unless they're plain ids
    site().bg={kind:"photo",assetId:'x"),url("https://example.com/p.png'};await emit();
    check("background: odd asset id ignored",!d.body.style.getPropertyValue("--bg-url"));
    site().bg={kind:"preset",preset:"listening"};await emit();
    // stock photos: slider 0 / 50 / 100 lays the wash at 70% / 83% / 95%
    const wash=async v=>{site().dim=v;await emit();return d.body.style.getPropertyValue("--bg-dim")};
    const w0=await wash(0),w50=await wash(50),w100=await wash(100);
    check("stock photo slider: 70% / 83% / 95%",w0==="70%"&&w50==="83%"&&w100==="95%",[w0,w50,w100].join(" "));
    delete site().dim;await emit();
    // background thumbnails in Settings are real tiles (the filter's color squares share their class name)
    q("#settingsBtn").click();await sleep(300);
    const tile=q('.bgtile[data-bg="preset:grille"] .sw'),tw=tile?tile.getBoundingClientRect().width:0;
    check("settings: Record shop offered, Pegboard gone",!!q('.bgtile[data-bg="preset:shop"]')&&!q('.bgtile[data-bg="preset:pegboard"]'));
    check("settings: background thumbnails show",tw>60&&getComputedStyle(tile).backgroundImage!=="none",`width ${tw}`);
    // hanging: four tiles, each in its own style whatever the wall uses; picking one restyles the wall and saves it
    const rack=()=>[...q("#rack").classList].filter(c=>c.startsWith("rail-")).join();
    check("hanging: four tiles, Barnwood by default",d.querySelectorAll(".hangtile").length===4&&q('.hangtile[data-hang="barn"]').getAttribute("aria-pressed")==="true"&&rack()==="rail-barn",rack());
    check("hanging: a tile keeps its own style",getComputedStyle(q('.hangtile[data-hang="cork"] .clip')).width==="13px"&&!/rail-/.test(d.body.className));
    q('.hangtile[data-hang="cork"]').click();await sleep(300);
    check("hanging: picking Cork restyles the wall and saves",rack()==="rail-cork"&&site().hang==="cork"&&q('.hangtile[data-hang="cork"]').getAttribute("aria-pressed")==="true",rack());
    site().hang="twine";await emit();
    check("hanging: an unknown style falls back to Barnwood",rack()==="rail-barn",rack());
    delete site().hang;await emit();
    q("#closeBtn").click();await sleep(200);
    // settings saves write only what changed
    site().discogs={status:"ok",verifiedUser:"tester"};  // as if the task wrote it and the page hasn't heard yet
    q("#settingsBtn").click();await sleep(300);q("#st-title").value="Test wall";q("#st-title").dispatchEvent(new Event("input"));await sleep(900);
    check("settings: save keeps others' changes",site().title==="Test wall"&&site().discogs?.status==="ok",JSON.stringify(site()));
    need(q("#closeBtn"),"#closeBtn after settings").click();await sleep(200);
    // import takes known record fields only, with fresh sync state
    const file=new w.File([JSON.stringify({vinylWall:1,records:{imp1:{title:"Imported One",artist:"Tester",status:"own",notes:[],
      discogsSync:{state:"synced",rid:5,instanceId:6},needsSync:false,stray:"x"}}})],"lib.json",{type:"application/json"});
    q("#settingsBtn").click();await sleep(300);need(q("#lib-import"),"#lib-import").click();await sleep(200);
    const dt=new w.DataTransfer();dt.items.add(file);q("#lib-file").files=dt.files;q("#lib-file").dispatchEvent(new w.Event("change"));await until(()=>q("#lib-yes"));
    need(q("#lib-yes"),"#lib-yes ("+(q(".libflow")?.textContent||"no import sheet")+")").click();await until(()=>q("#lib-see"));
    const r=w.__data.records.imp1;
    check("import: known fields, fresh sync",r&&!r.discogsSync&&!r.stray&&r.needsSync===true&&r.title==="Imported One",JSON.stringify(r));
  }catch(e){check("ran without throwing",false,e.message)}
  check("no script errors",!errs.length,errs.join("; "));
  document.getElementById("out").textContent=out.join("\n");
  document.title=failed?`DONE ${failed} failed`:"DONE all passed";
};
</script>
